<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <path id="textring" d="M 256 91 A 165 165 0 1 1 255.99 91"/>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1b2230"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
  </defs>

  <!-- outer neon ring (segmented) -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#9FEF00" stroke-width="9"
          stroke-dasharray="420 40 700 40 220 56" stroke-linecap="round"
          transform="rotate(-70 256 256)"/>

  <!-- body -->
  <circle cx="256" cy="256" r="214" fill="url(#bg)" stroke="#3a4150" stroke-width="12"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#9FEF00" stroke-width="2" opacity="0.35"/>

  <!-- ring text -->
  <text font-family="'Courier New', monospace" font-size="21" font-weight="bold" fill="#8b93a1">
    <textPath href="#textring" textLength="1020" lengthAdjust="spacing">X4YD  •  NOTION BLOG  •  WRITEUPS  •  NOTES  •  X4YD  •  NOTION BLOG  •  WRITEUPS  •</textPath>
  </text>

  <!-- inner disc -->
  <circle cx="256" cy="256" r="122" fill="#0d1117" stroke="#9FEF00" stroke-width="3" opacity="0.9"/>
  <circle cx="256" cy="256" r="108" fill="none" stroke="#3a4150" stroke-width="2" stroke-dasharray="4 8"/>

  <!-- Notion-style N tile -->
  <rect x="198" y="198" width="116" height="116" rx="16" fill="#9FEF00" opacity="0.25"/>
  <rect x="192" y="192" width="116" height="116" rx="16" fill="#f3f3f1" stroke="#111" stroke-width="6"/>
  <text x="250" y="277" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="92" font-weight="bold" fill="#111">N</text>

  <!-- small corner badge (like the CPTS one) -->
  <circle cx="108" cy="402" r="42" fill="#0d1117" stroke="#9FEF00" stroke-width="7"/>
  <rect x="90" y="382" width="36" height="42" rx="5" fill="none" stroke="#9FEF00" stroke-width="4"/>
  <line x1="97" y1="395" x2="119" y2="395" stroke="#9FEF00" stroke-width="3" stroke-linecap="round"/>
  <line x1="97" y1="404" x2="119" y2="404" stroke="#9FEF00" stroke-width="3" stroke-linecap="round"/>
  <line x1="97" y1="413" x2="110" y2="413" stroke="#9FEF00" stroke-width="3" stroke-linecap="round"/>

  <!-- small top-left accent -->
  <circle cx="150" cy="118" r="24" fill="#0d1117" stroke="#9FEF00" stroke-width="5"/>
  <path d="M141 118 l6 6 l12 -13" fill="none" stroke="#9FEF00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
